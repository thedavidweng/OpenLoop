name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high --ignore-registry-errors

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format:check

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Frontend tests with coverage
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm vitest run --coverage --reporter=junit --outputFile=test-results.junit.xml

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload coverage report
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: coverage
          flags: frontend
          fail_ci_if_error: false

      - name: Frontend build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec vite build

  rust-fmt-check:
    name: Rust Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

  rust-test:
    name: Rust Test
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache sidecar downloads
        uses: actions/cache@v5
        with:
          path: src-tauri/binaries/.cache
          key: ${{ runner.os }}-uv-sidecars-${{ hashFiles('scripts/prepare-sidecars.mjs') }}

      - name: Prepare sidecars
        run: node scripts/prepare-sidecars.mjs

      - name: Rust compile check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust audit
        run: |
          cargo install cargo-audit --locked
          cargo audit -f src-tauri/Cargo.lock

      - name: Rust tests
        run: cargo test -q --manifest-path src-tauri/Cargo.toml

  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml

  pr-lint:
    name: PR Title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: [frontend, rust-fmt-check, rust-test, cargo-deny, pr-lint]
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        run: |
          echo "frontend: ${{ needs.frontend.result }}"
          echo "rust-fmt-check: ${{ needs['rust-fmt-check'].result }}"
          echo "rust-test: ${{ needs['rust-test'].result }}"
          echo "cargo-deny: ${{ needs['cargo-deny'].result }}"
          echo "pr-lint: ${{ needs['pr-lint'].result }}"
          test "${{ needs.frontend.result }}" = "success"
          test "${{ needs['rust-fmt-check'].result }}" = "success"
          test "${{ needs['rust-test'].result }}" = "success"
          test "${{ needs['cargo-deny'].result }}" = "success"
          # pr-lint only runs on PRs; skip on push
          if [ "${{ needs.pr-lint.result }}" != "skipped" ]; then
            test "${{ needs.pr-lint.result }}" = "success"
          fi
