name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      # Read-only checks share node_modules and do not write the Vite or
      # coverage outputs. One runner, overlapped, instead of five serial steps.
      - parallel:
          - name: Audit dependencies
            run: pnpm audit --audit-level=high --ignore-registry-errors

          - name: Typecheck
            run: pnpm typecheck

          - name: Format check
            run: pnpm format:check

          - name: Lint
            run: pnpm lint

          - name: knip (unused exports / dependencies)
            run: pnpm knip --no-progress

      - name: Frontend tests with coverage
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm vitest run --coverage --reporter=junit --outputFile=test-results.junit.xml

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload coverage report
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: coverage
          flags: frontend
          fail_ci_if_error: false

      - name: Frontend build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec vite build

  native:
    name: Native Swift
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Native compile check
        run: swift build --package-path native -Xswiftc -warnings-as-errors

      - name: Native contracts
        run: swift test --package-path native -Xswiftc -warnings-as-errors

      - name: Setup Node for verified uv sidecar
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Native documentation and CLA contracts
        run: node scripts/validate-readme.mjs && node scripts/validate-release-notes.mjs && node scripts/check-cla.test.cjs

      - name: Prepare Apple Silicon sidecar
        env:
          TAURI_TARGET_TRIPLE: aarch64-apple-darwin
        run: node scripts/prepare-sidecars.mjs

      - name: Package and verify signed native app
        run: python3 native/scripts/package-app.py --uv src-tauri/binaries/uv-aarch64-apple-darwin

      - name: Packaged headless CLI and signature smoke
        run: python3 native/scripts/smoke-cli.py

  rust-fmt-check:
    name: Rust Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

  rust-test:
    name: Rust Test
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.96.0

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache sidecar downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/binaries/.cache
          key: ${{ runner.os }}-uv-sidecars-${{ hashFiles('scripts/prepare-sidecars.mjs') }}

      - name: Prepare sidecars
        run: node scripts/prepare-sidecars.mjs

      # cargo-audit does not write src-tauri/target. check, clippy, and
      # test stay in one script so they share that directory. `wait` is not
      # accepted by the workflow parser here, so the overlap is a parallel group.
      - parallel:
          - name: Rust audit
            run: |
              cargo install cargo-audit --locked
              cd src-tauri && cargo audit --ignore RUSTSEC-2026-0285 --ignore RUSTSEC-2024-0370

          - name: Rust compile, clippy, and tests
            run: |
              cargo check --manifest-path src-tauri/Cargo.toml
              cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
              cargo test -q --manifest-path src-tauri/Cargo.toml

  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # cargo-deny-action ships its own toolchain; rust-toolchain.toml must not override it
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml

  pr-lint:
    name: PR Title
    runs-on: ubuntu-slim
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write # Needed by zizmor-action to upload SARIF results.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        uses: reviewdog/action-actionlint@2085657ab2c7f48c58edcc767fba576f63bea76b # v1.77.0
        with:
          # actionlint 1.7.x does not know the 2026-06 step concurrency keys yet.
          actionlint_flags: '-ignore ''unexpected key "(background|parallel|wait|wait-all|cancel)"'' -ignore ''step must run script with "run" section or run action with "uses" section'''

      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          persona: pedantic
          min-severity: low

  validate:
    name: Validate
    runs-on: ubuntu-slim
    needs: [frontend, native, rust-fmt-check, rust-test, cargo-deny, pr-lint, workflow-lint]
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          FORMAT_RESULT: ${{ needs['rust-fmt-check'].result }}
          RUST_RESULT: ${{ needs['rust-test'].result }}
          DENY_RESULT: ${{ needs['cargo-deny'].result }}
          WORKFLOW_RESULT: ${{ needs['workflow-lint'].result }}
          PR_RESULT: ${{ needs['pr-lint'].result }}
        run: |
          test "$FRONTEND_RESULT" = success
          test "$NATIVE_RESULT" = success
          test "$FORMAT_RESULT" = success
          test "$RUST_RESULT" = success
          test "$DENY_RESULT" = success
          test "$WORKFLOW_RESULT" = success
          # PR title checks do not run on main pushes.
          if [ "$PR_RESULT" != skipped ]; then
            test "$PR_RESULT" = success
          fi
