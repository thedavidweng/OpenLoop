name: Native CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm format:check
      - run: pnpm validate:docs && node scripts/check-cla.test.cjs

  native:
    name: Native Swift
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Native compile check
        run: swift build --package-path native -Xswiftc -warnings-as-errors

      - name: Native contracts
        run: swift test --package-path native -Xswiftc -warnings-as-errors

      - name: Setup Node for verified uv sidecar
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Native documentation and CLA contracts
        run: node scripts/validate-readme.mjs && node scripts/validate-release-notes.mjs && node scripts/check-cla.test.cjs

      - name: Prepare Apple Silicon sidecar
        run: node scripts/prepare-sidecars.mjs

      - name: Package and verify signed native app
        run: python3 native/scripts/package-app.py --uv native/binaries/uv-aarch64-apple-darwin

      - name: Packaged headless CLI and signature smoke
        run: python3 native/scripts/smoke-cli.py

  pr-lint:
    name: PR Title
    runs-on: ubuntu-slim
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write # Needed by zizmor-action to upload SARIF results.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: jactionlint
        uses: jdx/jactionlint@2462f925040c2aa1c88714dc85bc12d869cc4998 # v2.0.2
        with:
          profile: default

      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          persona: pedantic
          min-severity: low

  validate:
    name: Validate
    runs-on: ubuntu-slim
    needs: [tooling, native, pr-lint, workflow-lint]
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        env:
          TOOLING_RESULT: ${{ needs.tooling.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          WORKFLOW_RESULT: ${{ needs['workflow-lint'].result }}
          PR_RESULT: ${{ needs['pr-lint'].result }}
        run: |
          test "$TOOLING_RESULT" = success
          test "$NATIVE_RESULT" = success
          test "$WORKFLOW_RESULT" = success
          # PR title checks do not run on main pushes.
          if [ "$PR_RESULT" != skipped ]; then
            test "$PR_RESULT" = success
          fi
