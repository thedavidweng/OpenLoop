name: CLA

on:
  # Required for fork signatures; only trusted repository code executes, without caches or PR code.
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    name: CLA Assistant
    permissions:
      contents: read
      pull-requests: write # Read consent and append verified signature records.
      statuses: write # Publish the CLA result on the checked PR head.
    if: >-
      github.repository == 'thedavidweng/OpenLoop' &&
      (github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        github.event.comment.user.type == 'User' &&
        (github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify and record contributor signatures
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            await require('./scripts/check-cla.cjs')({ github, context });
