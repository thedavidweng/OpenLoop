name: Dependabot Auto-format

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependabot-fmt-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-fmt:
    name: Auto-format Dependabot PRs
    permissions:
      contents: write # Push formatting changes to the Dependabot branch.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run oxfmt
        run: node --run format

      - name: Commit formatting changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes needed"
          else
            git commit -m "style: auto-format code"
            # GH_TOKEN expands inside the Git credential helper, not this shell.
            # shellcheck disable=SC2016
            git -c credential.helper= -c credential.helper='!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' push
          fi
