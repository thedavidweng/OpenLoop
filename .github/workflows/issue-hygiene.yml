name: Issue hygiene

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/issue-hygiene-trigger

permissions:
  issues: write

jobs:
  close-resolved:
    name: Close resolved issues
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Close #50 (multi-mirror)
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const body = [
              "Completed by PR #125: multi-mirror model download with automatic failover.",
              "",
              "Acceptance criteria met:",
              "- SHA256 verification after download",
              "- Ordered mirror URL list in settings (`model_mirrors`)",
              "- Automatic failover to next mirror on failure",
              "- CLI `openloop pull --mirror` supports multiple mirrors",
              "",
              "PR #125 referenced #50 in the title but did not use a `Closes` keyword.",
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 50,
              body,
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 50,
              state: "closed",
              state_reason: "completed",
            });

      - name: Comment on partial issues
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const comments = {
              53: [
                "Progress update (PR #121 merged — **keeping open**):",
                "",
                "**Done**",
                "- `model_manager/mod.rs` split into submodules (`download.rs`, `delete.rs`, `manifest.rs`, `mirror.rs`, etc.)",
                "",
                "**Not done** (explicitly deferred in #121)",
                "- `generation.ts` (~395 lines) and `model.ts` (~427 lines) still exceed 250 lines",
                "- `useGenerationForm()` hook not extracted",
                "- FormBody still coupled to the whole form object",
              ].join("\n"),
              59: [
                "Progress update (PR #123 merged — **keeping open**):",
                "",
                "**Done**",
                "- Phase 1: `005_history_indexes.sql` index migration (#115)",
                "- Phase 4: SQL `LIMIT` on `list_generations` + CLI `openloop list --limit` (#123)",
                "",
                "**Not done**",
                "- Phase 2: history search still client-side in `HistorySidebar.tsx`",
                "- Phase 3: `Array.includes()` → `useMemo` membership sets",
                "- Phase 5: model status aggregation cleanup",
              ].join("\n"),
              62: [
                "Progress update (PR #122 merged — **keeping open**):",
                "",
                "**Done**",
                "- `tracing` + `tracing-subscriber` JSONL logging (`observability.rs`)",
                "- CLI/GUI init paths wired",
                "- Partial migration from `eprintln!` to `tracing::*`",
                "- Machine-readable NDJSON event schema",
                "- Startup log file pruning (retain 10)",
                "",
                "**Not done**",
                "- Acceptance: no bare `eprintln!`/`println!` in `src-tauri` (CLI output still uses them)",
                "- Settings in-app log viewer with level/event filtering",
              ].join("\n"),
            };

            for (const [issue_number, body] of Object.entries(comments)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(issue_number),
                body,
              });
            }
