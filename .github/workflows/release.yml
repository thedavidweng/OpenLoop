name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.3.0-alpha.1"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: native-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-macos-dmg:
    name: Build native macOS DMG
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write # Creates the draft release and uploads its DMG.
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Setup Node for verified uv sidecar
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify release version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          test "v${PKG_VERSION}" = "${RELEASE_TAG%%-*}"
          echo "DMG_PATH=native/dist/OpenLoop_${PKG_VERSION}_aarch64.dmg" >> "$GITHUB_ENV"

      - name: Validate documentation
        run: node scripts/validate-readme.mjs && node scripts/validate-release-notes.mjs && node scripts/check-cla.test.cjs

      - name: Native compile check
        run: swift build --package-path native -Xswiftc -warnings-as-errors

      - name: Native contracts
        run: swift test --package-path native -Xswiftc -warnings-as-errors

      - name: Prepare Apple Silicon sidecar
        run: node scripts/prepare-sidecars.mjs

      - name: Package and verify signed native app and DMG
        run: python3 native/scripts/package-app.py --uv native/binaries/uv-aarch64-apple-darwin --dmg "$DMG_PATH"

      - name: Packaged headless CLI and signature smoke
        run: python3 native/scripts/smoke-cli.py

      - name: Upload DMG artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openloop-${{ env.RELEASE_TAG }}-macos-dmg
          path: ${{ env.DMG_PATH }}
          if-no-files-found: error

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_FLAGS=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "$DMG_PATH" --verify-tag --draft \
            --title "OpenLoop $RELEASE_TAG" --notes-file docs/release-notes/native.md \
            "${RELEASE_FLAGS[@]}"
