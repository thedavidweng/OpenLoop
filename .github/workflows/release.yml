name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.3.0-alpha.1"
        required: false
        type: string
      verification_only:
        description: "Build a signed main snapshot as an Actions artifact without publishing a release"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: native-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-macos-dmg:
    name: Build native macOS DMG
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write # Creates the draft release and uploads its DMG.
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      VERIFICATION_ONLY: ${{ inputs.verification_only || false }}
      APPLE_SIGNING_IDENTITY: "Developer ID Application: MOE AI LLC (NCFNX3LJ83)"
      APPLE_TEAM_ID: NCFNX3LJ83
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - name: Validate build mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$VERIFICATION_ONLY" == true ]]; then
            test "$EVENT_NAME" = workflow_dispatch
            test "$SOURCE_REF" = refs/heads/main
            test -z "$INPUT_TAG"
          elif [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            test -n "$INPUT_TAG"
          fi

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.verification_only && github.sha || inputs.tag || github.ref }}
          persist-credentials: false

      - name: Import Developer ID signing identity
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          : "${CERTIFICATE_BASE64:?}" "${CERTIFICATE_PASSWORD:?}" "${API_KEY_BASE64:?}"
          umask 077
          keychain="$RUNNER_TEMP/release-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          security find-identity -v -p codesigning "$keychain" | grep -F "$APPLE_SIGNING_IDENTITY"
          echo "APPLE_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"

      - name: Setup Node for verified uv sidecar
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          check-latest: true
          package-manager-cache: false

      - name: Verify release version
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERIFICATION_ONLY" == true ]]; then
            REVISION=$(git rev-parse HEAD)
            echo "DMG_PATH=native/dist/OpenLoop_${PKG_VERSION}_${REVISION}_acceptance_aarch64.dmg" >> "$GITHUB_ENV"
            echo "ARTIFACT_NAME=openloop-acceptance-${REVISION}" >> "$GITHUB_ENV"
          else
            test "v${PKG_VERSION}" = "${RELEASE_TAG%%-*}"
            echo "DMG_PATH=native/dist/OpenLoop_${PKG_VERSION}_aarch64.dmg" >> "$GITHUB_ENV"
            echo "ARTIFACT_NAME=openloop-${RELEASE_TAG}-macos-dmg" >> "$GITHUB_ENV"
          fi

      - name: Validate documentation
        run: node scripts/validate-readme.mjs && node scripts/validate-release-notes.mjs && node scripts/check-cla.test.cjs

      - name: Prepare Apple Silicon sidecar
        run: node scripts/prepare-sidecars.mjs

      - name: Native compile check
        run: swift build --package-path native --jobs 2 -Xswiftc -warnings-as-errors

      - name: Native contracts
        run: swift test --package-path native --jobs 2 -Xswiftc -warnings-as-errors

      - name: Test release signing and packaging gates
        run: python3 native/scripts/test-notarization.py && python3 native/scripts/test-package-app.py && python3 native/scripts/test-audio-encoder.py && python3 native/scripts/test-package-report.py

      - name: Package and verify signed native app and DMG
        run: python3 native/scripts/package-app.py --uv native/binaries/uv-aarch64-apple-darwin --sign "$APPLE_SIGNING_IDENTITY" --notarize --dmg "$DMG_PATH"

      - name: Packaged local audio export contracts
        run: python3 native/scripts/test-audio-exports.py

      - name: Packaged headless CLI and signature smoke
        run: python3 native/scripts/smoke-cli.py

      - name: Record package size and source
        run: |
          python3 native/scripts/package-report.py --bundle native/dist/OpenLoop.app \
            --dmg "$DMG_PATH" --output native/dist/package-report.json
          cat native/dist/package-report.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.DMG_PATH }}
            native/dist/package-report.json
          if-no-files-found: error

      - name: Create draft GitHub release
        if: ${{ !inputs.verification_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_FLAGS=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "$DMG_PATH" --verify-tag --draft \
            --title "OpenLoop $RELEASE_TAG" --notes-file docs/release-notes/signed-native.md \
            "${RELEASE_FLAGS[@]}"

      - name: Remove signing material
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/release-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/release-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-key.p8"
