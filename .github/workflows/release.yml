name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0-alpha.1"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos-dmg:
    name: Build macOS DMG
    runs-on: macos-14
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Resolve release tag
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package.json version matches release tag
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "v${PKG_VERSION}" != "${TAG%%-*}" ] && [ "v${PKG_VERSION}" != "${TAG}" ]; then
            echo "::error::Release tag ${TAG} does not match package.json version ${PKG_VERSION}."
            echo "::error::Bump package.json (and run pnpm version:sync), re-tag, and retry."
            exit 1
          fi

      - name: Audit dependencies
        run: pnpm audit --audit-level=high --ignore-registry-errors

      - name: Prepare sidecars
        run: pnpm prepare:sidecars

      - name: Run release checks
        run: pnpm release:check

      - name: Read release notes
        id: notes
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          NOTES_FILE="docs/release-notes/${TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            NOTES=$(cat "$NOTES_FILE")
          else
            NOTES="Release ${TAG}"
          fi
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and draft GitHub release
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater artifacts (latest.json + .sig) are only produced when the
          # minisign private key is available. The public half lives in
          # tauri.conf.json plugins.updater.pubkey — the two must be a pair.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: "OpenLoop ${{ steps.release.outputs.tag }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          # Prerelease only for suffixed tags (v0.3.0-alpha.1). GitHub's
          # /releases/latest — where the in-app updater looks — skips
          # prereleases, so plain-version tags must publish as full releases
          # or the auto-updater never sees them.
          prerelease: ${{ contains(steps.release.outputs.tag, '-') }}
          args: --target aarch64-apple-darwin

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: openloop-${{ steps.release.outputs.tag }}-macos-dmg
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload latest.json to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          LATEST_JSON=$(find src-tauri/target -name "latest.json" -path "*/bundle/*" | head -1)
          if [ -n "$LATEST_JSON" ]; then
            gh release upload "$TAG" "$LATEST_JSON" --clobber
            echo "Uploaded latest.json to release $TAG"
          else
            echo "::warning::latest.json not found in build output — updater may not detect this release"
          fi
