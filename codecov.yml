coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
    patch:
      default:
        target: 80%

  precision: 1
  round: down
  range: "60...100"

  ignore:
    # Tauri IPC thin wrappers — single-line invoke() calls; testing them
    # validates the Tauri framework, not our logic.
    - src/app/lib/api.ts
    # App entry point — bootstraps React + Tauri, not testable in jsdom.
    - src/main.tsx
    # i18next bootstrap — side-effectful init module, no branching logic.
    - src/app/lib/i18n.ts
    # Runtime hooks that require the real Tauri window/menu bridge; unit-test
    # mocks would only exercise the mock, not meaningful behavior.
    - src/app/runtime/app-ready-runtime.ts
    - src/app/runtime/menu-runtime.ts

flags:
  frontend:
    paths:
      - src/
    carryforward: true

component_management:
  individual_components:
    - component_id: frontend
      name: frontend
      paths:
        - src/**
    - component_id: rust
      name: rust
      paths:
        - src-tauri/**

comment:
  layout: "header, diff, flags, components, files"
  require_changes: true
