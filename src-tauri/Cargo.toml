[package]
name = "openloop"
version = "0.2.0"
description = "OpenLoop desktop shell"
authors = ["OpenLoop contributors"]
license = "Apache-2.0"
edition = "2021"
default-run = "openloop"

[lib]
name = "openloop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[[bin]]
name = "openloop"
path = "src/main.rs"

[build-dependencies]
cc = "1.2.65"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
dialoguer = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
futures-util = "0.3"
sha2 = "0.11"
tokio = { version = "1.52.3", features = ["fs", "io-util", "rt", "rt-multi-thread", "sync", "macros", "time"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6.0", default-features = false, features = ["flac", "mp3", "ogg", "pcm", "vorbis", "wav"] }
tauri = { version = "2.11.3", features = ["unstable"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-updater = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = "8"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[dev-dependencies]
mockito = "1.7.0"
tempfile = "3.27.0"
