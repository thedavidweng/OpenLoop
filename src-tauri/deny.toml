[advisories]
unmaintained = "workspace"
yanked = "warn"
ignore = [
    { id = "RUSTSEC-2026-0194", reason = "Transitive via plist ^0.39; blocked until upstream bumps quick-xml" },
    { id = "RUSTSEC-2026-0195", reason = "Transitive via plist ^0.39; blocked until upstream bumps quick-xml" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "0BSD",
    "MPL-2.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "MIT-0",
    "Apache-2.0 WITH LLVM-exception",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
